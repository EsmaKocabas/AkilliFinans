name: akilli_finans_mobile
description: Wireframe-first financial mobile UI built with Flutter.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  mapbox_maps_flutter: ^2.24.2
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  flutter_dotenv: ^5.2.1
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/user_location.png
    - assets/icons/atm_marker.png
